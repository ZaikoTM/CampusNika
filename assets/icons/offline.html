<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin conexión | Campus Nika</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(180deg, #0a192f 0%, #020617 100%);
            color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; text-align: center; padding: 24px;
        }
        .box { max-width: 420px; }
        .emoji { font-size: 3.2rem; margin-bottom: 10px; }
        h1 { font-size: 1.4rem; font-weight: 800; margin: 0 0 8px 0; color: #fff; }
        p { font-size: 0.92rem; color: #94a3b8; line-height: 1.5; margin-bottom: 22px; }
        button {
            background: #0284c7; color: #fff; border: none; padding: 12px 26px; border-radius: 10px;
            font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: background 0.2s;
        }
        button:hover { background: #0369a1; }
    </style>
</head>
<body>
    <div class="box">
        <div class="emoji">📡</div>
        <h1>Sin conexión, compañero</h1>
        <p>Parece que se cortó internet. Lo que ya visitaste (dashboard, exámenes descargados, notas) puede seguir disponible; el resto necesita señal.</p>
        <button onclick="location.reload()">Reintentar</button>
    </div>
</body>
</html>
