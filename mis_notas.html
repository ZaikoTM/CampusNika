<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis notas | Campus Nika</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="stylesheet" href="styles.css">
<style>
  body { margin: 0; background: var(--bg-body, #f1f5f9); color: var(--text-main, #0f172a); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  .mn-wrap { max-width: 860px; margin: 0 auto; padding: 22px 16px 60px; }
  .mn-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .mn-top h1 { font-size: 1.4rem; margin: 0; flex: 1 1 auto; }
  .mn-top a, .mn-top button { font: inherit; font-weight: 700; font-size: .85rem; border: 1px solid var(--border, #cbd5e1); background: var(--card-bg, #fff); color: inherit; border-radius: 10px; padding: 8px 12px; cursor: pointer; text-decoration: none; }
  .mn-filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .mn-filtros input, .mn-filtros select { font: inherit; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--border, #cbd5e1); background: var(--card-bg, #fff); color: inherit; }
  .mn-filtros input { flex: 1 1 220px; }
  .mn-grupo { margin-bottom: 18px; }
  .mn-grupo h2 { font-size: .95rem; margin: 0 0 8px; color: #0369a1; }
  .mn-n { background: var(--card-bg, #fff); border: 1px solid var(--border, #e2e8f0); border-left: 4px solid #facc15; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; display: flex; gap: 10px; align-items: flex-start; }
  .mn-n .mn-c { flex: 1; min-width: 0; }
  .mn-n .mn-tx { white-space: pre-wrap; word-break: break-word; font-size: .92rem; }
  .mn-n .mn-meta { font-size: .75rem; opacity: .7; margin-top: 4px; }
  .mn-n .mn-pos { background: #0ea5e9; color: #fff; border-radius: 99px; padding: 3px 9px; font-weight: 800; font-size: .74rem; white-space: nowrap; }
  .mn-n button { background: transparent; border: 0; cursor: pointer; color: inherit; opacity: .55; font-size: 1rem; }
  .mn-n button:hover { opacity: 1; }
  .mn-vacio { text-align: center; opacity: .7; padding: 40px 10px; }
  @media print { .mn-top a, .mn-top button, .mn-filtros, .mn-n button { display: none !important; } body { background: #fff; } }
</style>
</head>
<body>
<main class="mn-wrap">
  <div class="mn-top">
    <h1>📝 Mis notas y marcadores</h1>
    <a href="campus.html">← Volver al campus</a>
    <button type="button" onclick="window.print()">🖨️ Imprimir</button>
  </div>
  <div class="mn-filtros">
    <input id="mn-q" type="search" placeholder="Buscar en tus notas…" aria-label="Buscar en tus notas">
    <select id="mn-mod" aria-label="Filtrar por materia"><option value="">Todas las materias</option></select>
  </div>
  <div id="mn-lista"><p class="mn-vacio">Cargando…</p></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script>
(function () {
  const NOMBRES = { cirugia: 'Cirugía', ginecologia: 'Ginecología', siam: 'S.I.A.M.', pfo: 'PFO', medicinalegal: 'Medicina Legal', medicinadeportiva: 'Medicina Deportiva' };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (s) => { s = Math.floor(s || 0); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(r).padStart(2, '0'); };
  let todas = [], uid = null, cli = null;
  const $ = (i) => document.getElementById(i);

  async function cargar() {
    let locales = []; try { locales = JSON.parse(localStorage.getItem('nika_notas_estudio') || '[]'); } catch (_) {}
    todas = locales.slice();
    try {
      const ns = window.NikaSupabase; if (ns && ns.ready) await ns.ready; cli = ns && ns.client;
      const { data: s } = await cli.auth.getSession(); uid = s && s.session && s.session.user ? s.session.user.id : null;
      if (uid) { const { data } = await cli.from('notas_estudio').select('*').order('creado_en', { ascending: false }); if (data) todas = todas.concat(data); }
    } catch (_) {}
    const mods = [...new Set(todas.map((n) => n.modulo).filter(Boolean))];
    $('mn-mod').innerHTML = '<option value="">Todas las materias</option>' + mods.map((m) => '<option value="' + esc(m) + '">' + esc(NOMBRES[m] || m) + '</option>').join('');
    pintar();
  }

  function pintar() {
    const q = $('mn-q').value.trim().toLowerCase(), m = $('mn-mod').value;
    const lista = todas.filter((n) => (!m || n.modulo === m) && (!q || (n.texto + ' ' + (n.recurso_titulo || '')).toLowerCase().includes(q)));
    if (!lista.length) { $('mn-lista').innerHTML = '<p class="mn-vacio">' + (todas.length ? 'No hay notas con ese filtro.' : 'Todavía no tomaste notas. Abrí un video o material en la sala de estudio y escribí la primera.') + '</p>'; return; }
    const grupos = {}; lista.forEach((n) => { const k = n.recurso_titulo || n.recurso; (grupos[k] = grupos[k] || []).push(n); });
    $('mn-lista').innerHTML = Object.keys(grupos).map((k) => {
      const g = grupos[k].sort((a, b) => (a.posicion == null ? 1e12 : a.posicion) - (b.posicion == null ? 1e12 : b.posicion));
      const mat = NOMBRES[g[0].modulo] || g[0].modulo || '';
      return '<section class="mn-grupo"><h2>' + esc(k) + (mat ? ' · ' + esc(mat) : '') + '</h2>' + g.map((n) => {
        const pos = n.posicion == null ? '' : '<span class="mn-pos">' + (n.tipo === 'video' ? '⏱ ' + fmt(n.posicion) : '📄 Pág. ' + n.posicion) + '</span>';
        const href = n.modulo ? 'estudio.html?modulo=' + encodeURIComponent(n.modulo) : '';
        return '<div class="mn-n" data-id="' + esc(n.id) + '">' + pos + '<div class="mn-c"><div class="mn-tx">' + esc(n.texto) + '</div><div class="mn-meta">' + new Date(n.creado_en).toLocaleDateString('es-AR') + (href ? ' · <a href="' + href + '">Ir a la sala</a>' : '') + '</div></div><button type="button" title="Borrar" aria-label="Borrar nota">✕</button></div>';
      }).join('') + '</section>';
    }).join('');
  }

  $('mn-q').addEventListener('input', pintar); $('mn-mod').addEventListener('change', pintar);
  $('mn-lista').addEventListener('click', async (e) => {
    const b = e.target.closest('button'); const it = e.target.closest('.mn-n'); if (!b || !it) return;
    const n = todas.find((x) => String(x.id) === it.dataset.id); if (!n || !confirm('¿Borrar esta nota?')) return;
    todas = todas.filter((x) => x !== n);
    if (n.local) { try { localStorage.setItem('nika_notas_estudio', JSON.stringify(JSON.parse(localStorage.getItem('nika_notas_estudio') || '[]').filter((x) => x.id !== n.id))); } catch (_) {} }
    else if (cli) { try { await cli.from('notas_estudio').delete().eq('id', n.id); } catch (_) {} }
    pintar();
  });
  cargar();
})();
</script>
</body>
</html>
