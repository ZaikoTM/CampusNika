<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Llamada de Ateneos | NikaMed</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f8fafc; --card: #fff; --txt: #0f172a; --mut: #64748b; --bd: #e2e8f0; --nika-primary: #0284c7; --card-bg: #fff; --border: #e2e8f0; --text-main: #0f172a; --text-muted: #64748b; --bg-body: #f8fafc; --shadow: 0 10px 24px -18px rgba(15,23,42,.5); }
        @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --card: #111a2e; --txt: #f1f5f9; --mut: #94a3b8; --bd: #1e293b; --card-bg: #111a2e; --border: #1e293b; --text-main: #f1f5f9; --text-muted: #94a3b8; --bg-body: #0b1220; } }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: var(--bg); color: var(--txt); display: flex; flex-direction: column; align-items: center; padding: 22px 16px 120px; text-align: center; }
        .h-logo { width: 54px; height: 54px; border-radius: 16px; margin-bottom: 8px; }
        h1 { font-size: 1.15rem; margin: 6px 0 4px; font-weight: 800; }
        p { margin: 4px 0; color: var(--mut); font-size: .86rem; line-height: 1.5; max-width: 340px; }
        .h-estado { margin-top: 16px; padding: 14px 16px; border-radius: 18px; background: var(--card); border: 1px solid var(--bd); width: 100%; max-width: 380px; }
        .h-estado b { display: block; font-size: 1rem; }
        .h-punto { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #22c55e; margin-right: 6px; animation: pulso 1.8s infinite; }
        .h-punto.off { background: #94a3b8; animation: none; }
        @keyframes pulso { 70% { box-shadow: 0 0 0 8px rgba(34,197,94,0); } 0% { box-shadow: 0 0 0 0 rgba(34,197,94,.6); } }
        .h-acc { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
        .h-acc button { border: 0; border-radius: 12px; padding: 10px 14px; font: 800 .8rem inherit; font-family: inherit; cursor: pointer; background: #0284c7; color: #fff; transition: transform .15s, box-shadow .2s; }
        .h-acc button:hover { transform: translateY(-2px); box-shadow: 0 10px 18px -12px #0284c7; }
        .h-acc button.sec { background: transparent; color: inherit; border: 2px solid var(--bd); }
        /* el motor de la llamada (barra de controles y videos) se integra a la tarjeta en vez de flotar encima */
        body.at-host #at-dock { position: static !important; left: auto !important; right: auto !important; top: auto !important; bottom: auto !important; transform: none !important; width: 100%; max-width: 400px; margin: 14px auto 0; padding: 12px 14px; border-radius: 20px; opacity: 1 !important; flex-direction: column; gap: 10px; z-index: auto; cursor: default; }
        body.at-host #at-dock.on { display: flex; }
        body.at-host #at-dock .at-d-info { width: 100%; justify-content: center; }
        body.at-host #at-dock .at-d-txt { display: block !important; text-align: left; }
        body.at-host #at-dock .at-d-txt b { max-width: 240px; }
        body.at-host #at-dock .at-d-btns { display: flex !important; flex-wrap: wrap; justify-content: center; gap: 10px; width: 100%; }
        body.at-host #at-dock #at-b-cam, body.at-host #at-dock #at-b-scr, body.at-host #at-dock #at-b-aud { display: inline-flex !important; }
        body.at-host #at-dock #at-b-min, body.at-host #at-dock #at-b-ext, body.at-host #at-dock #at-b-sala, body.at-host #at-dock #at-b-win, body.at-host #at-dock #at-b-pip { display: none !important; }
        body.at-host #at-pip { position: static !important; right: auto !important; top: auto !important; left: auto !important; width: 100% !important; max-width: 400px; margin: 14px auto 0; border-radius: 20px; z-index: auto; }
        body.at-host #at-pip .at-pip-h { display: none; }
        body.at-host #at-pip .at-pip-grid { padding: 8px; }
        body.at-host .h-estado { max-width: 400px; }
        body.mini { padding: 8px; }
        body.mini.at-host #at-pip { display: none !important; }
        body.mini h1, body.mini p, body.mini .h-logo, body.mini .h-aviso, body.mini #h-sub { display: none; }
        body.mini .h-estado { margin: 0; padding: 8px 12px; }
        body.mini .h-acc { margin-top: 8px; }
        .h-aviso { margin-top: 14px; padding: 10px 14px; border-radius: 14px; background: rgba(245,158,11,.14); color: #92400e; font-weight: 700; font-size: .8rem; max-width: 380px; }
    </style>
</head>
<body>
    <img class="h-logo" src="assets/N%20NIKA.png" alt="NikaMed">
    <h1>Llamada de Ateneos</h1>
    <p>Esta ventana mantiene tu llamada activa mientras navegás por el campus: <b>no la cierres</b>, minimizala.</p>
    <div class="h-estado"><b id="h-nombre"><i class="h-punto off"></i>Sin llamada activa</b><p id="h-sub">Entrá a una sala o llamá a un amigo desde el campus.</p></div>
    <div class="h-acc">
        <button type="button" id="h-pip" title="Un recuadro pequeño que queda siempre encima de las demás ventanas" hidden>📌 Mini flotante (siempre encima)</button>
        <button type="button" class="sec" id="h-red" title="Achicar esta ventana">⬇ Reducir</button>
        <button type="button" class="sec" id="h-amp" title="Volver al tamaño normal" hidden>⬆ Ampliar</button>
    </div>
    <div class="h-aviso">Al cerrar esta ventana se termina la llamada. Podés moverla, minimizarla o reducirla.</div>

    <script>window.__ateneoHost = true; window.showToast = function (m) { var t = document.getElementById('h-sub'); if (t) t.textContent = m; };</script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <script src="js/voiceManager.js?v=3"></script>
    <script src="js/ateneos.js?v=16"></script>
    <script>
        (function () {
            var red = document.getElementById('h-red'), amp = document.getElementById('h-amp'), pipB = document.getElementById('h-pip');
            function reducir(v) {
                document.body.classList.toggle('mini', v); red.hidden = v; amp.hidden = !v;
                try { if (v) { window.resizeTo(340, 190); window.moveTo(Math.max(0, screen.availWidth - 360), Math.max(0, screen.availHeight - 240)); } else { window.resizeTo(440, 620); } } catch (_) {}
            }
            red.onclick = function () { reducir(true); }; amp.onclick = function () { reducir(false); };
            // Document Picture-in-Picture (Chrome / Edge de escritorio): el recuadro de la llamada flota siempre encima
            if ('documentPictureInPicture' in window) {
                pipB.hidden = false;
                pipB.onclick = async function () {
                    var dock = document.getElementById('at-dock');
                    if (!dock) { alert('Entrá primero a una llamada.'); return; }
                    try {
                        var pw = await documentPictureInPicture.requestWindow({ width: 340, height: 96 });
                        Array.prototype.forEach.call(document.styleSheets, function (ss) {
                            try { var st = pw.document.createElement('style'); st.textContent = Array.prototype.map.call(ss.cssRules, function (r) { return r.cssText; }).join('\n'); pw.document.head.appendChild(st); } catch (_) {}
                        });
                        var antes = dock.getAttribute('style') || '';
                        dock.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;top:auto;transform:none;display:flex;margin:0;';
                        pw.document.body.style.cssText = 'margin:0;background:#0b1220;';
                        pw.document.body.appendChild(dock);
                        pw.addEventListener('pagehide', function () { dock.setAttribute('style', antes); document.body.appendChild(dock); });
                    } catch (e) { alert('No se pudo abrir el recuadro flotante: ' + (e && e.message ? e.message : e)); }
                };
            }
        })();
        (function () {
            var nombre = document.getElementById('h-nombre'), sub = document.getElementById('h-sub');
            setInterval(function () {
                try {
                    var a = JSON.parse(localStorage.getItem('nika_ateneo_activo') || 'null');
                    if (window.VoiceManager && VoiceManager.yo && a) {
                        nombre.innerHTML = '<i class="h-punto"></i>' + String(a.nombre || 'Llamada').replace(/</g, '&lt;');
                        sub.textContent = 'Conectado: usá la barra de abajo para silenciar, cámara o salir.';
                    } else { nombre.innerHTML = '<i class="h-punto off"></i>Sin llamada activa'; }
                } catch (_) {}
            }, 1500);
        })();
    </script>
</body>
</html>
