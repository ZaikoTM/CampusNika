<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Conectando Spotify</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0b0e13; color: #f1f5f9; font-family: system-ui, sans-serif; text-align: center; padding: 20px; }
  .card { max-width: 380px; }
  .spin { width: 42px; height: 42px; margin: 0 auto 16px; border: 4px solid rgba(29,185,84,.25); border-top-color: #1db954; border-radius: 50%; animation: g 0.9s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
  a { color: #1db954; }
</style>
</head>
<body>
<div class="card">
  <div class="spin" id="spin"></div>
  <p id="msg">Conectando tu cuenta de Spotify…</p>
</div>
<script>
// Callback OAuth (Authorization Code + PKCE) de NikaMusic: canjea el código por tokens y vuelve a la página de origen.
(async function () {
  const msg = document.getElementById('msg');
  const fallar = (t) => { document.getElementById('spin').style.display = 'none'; msg.innerHTML = t + '<br><br><a href="campus.html">Volver al Campus</a>'; };
  try {
    const q = new URLSearchParams(location.search);
    const cfg = JSON.parse(localStorage.getItem('nika_spotify_cfg') || 'null');
    if (q.get('error')) return fallar('Spotify canceló la conexión (' + q.get('error') + ').');
    if (!cfg || !q.get('code') || q.get('state') !== cfg.state) return fallar('La respuesta de Spotify no es válida. Intentá conectar de nuevo.');

    const r = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        client_id: cfg.clientId, grant_type: 'authorization_code', code: q.get('code'),
        redirect_uri: cfg.redirect, code_verifier: cfg.verifier,
      }),
    });
    const d = await r.json();
    if (!r.ok) return fallar('Spotify rechazó la conexión: ' + (d.error_description || d.error || r.status));

    localStorage.setItem('nika_spotify_tokens', JSON.stringify({ access: d.access_token, refresh: d.refresh_token, exp: Date.now() + d.expires_in * 1000 }));
    localStorage.removeItem('nika_spotify_cfg');
    // Solo se vuelve a una página del mismo sitio
    let destino = 'campus.html';
    try { const u = new URL(cfg.volver); if (u.origin === location.origin) destino = u.href; } catch (_) {}
    location.replace(destino);
  } catch (err) {
    fallar('No se pudo completar la conexión: ' + (err && err.message ? err.message : err));
  }
})();
</script>
</body>
</html>
